[project]
name = "starter-path"
version = "0.1.0"
description = "Starter Path: mission-based RL for small-capital investment decisions in Rwanda"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gymnasium>=0.29",
    "pygame>=2.5",
    "pillow>=10",
    # PyTorch stopped publishing builds for Intel Macs after 2.2.2, and that version needs NumPy 1.x.
    # So Intel Macs get torch 2.2 + NumPy 1; every other machine gets the normal recent versions.
    "torch>=2.2,<2.3; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "numpy>=1.26,<2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torch>=2.2; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "numpy>=1.26; sys_platform != 'darwin' or platform_machine != 'x86_64'",
]

[dependency-groups]
dev = ["pytest>=8"]

# CPU-only PyTorch on Linux and Windows: a small download instead of several GB of GPU libraries.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
